name: Build

on:
  push:
    branches: [main]
    # A version tag (v1.0.0), or a push to main with a new pubspec version, also publishes a GitHub Release.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new Flutter release can't change or break a build by surprise. Update on purpose.
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      # The release this run publishes, or empty: a version tag (v1.0.3) pushed, or a push to main whose
      # pubspec.yaml version has no release yet (bump the version, merge, and the release is made from main).
      release_tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Release to publish
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          elif [[ "$GITHUB_REF" == refs/heads/main && "$GITHUB_EVENT_NAME" != pull_request ]]; then
            v=$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)
            if [ -n "$v" ] && ! gh release view "v$v" >/dev/null 2>&1; then tag="v$v"; fi
          fi
          echo "Release: ${tag:-none}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: USB bridge (fake Web Serial and esptool) and editor shortcuts, in Node
        run: node --test test/js/robocore_usb.test.mjs test/js/robocore_editors.test.mjs test/js/robocore_serial_shim.test.mjs
      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          # Show errors first, then warnings, as annotations on the run page.
          for lvl in ERROR WARNING; do
            grep "^$lvl|" analyze.txt | awk -F"|" '!seen[$3 FS $8]++' | head -45 | while IFS='|' read -r sev type code file line col len msg; do
              f=${file#$GITHUB_WORKSPACE/}
              echo "::error file=$f,line=$line,col=$col,title=$code::$f:$line:$col $msg"
            done
          done
          cat analyze.txt
          ! grep -q "^ERROR|" analyze.txt
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          exit $code
      - name: Save logs to the ci-logs branch
        if: always()
        run: |
          # pubspec.lock too: the packages as resolved here, to commit after adding a package.
          mkdir -p /tmp/ci && cp analyze.txt test.txt pubspec.lock /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci && git init -q && git checkout -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

  web:
    name: Web
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web
      # Pull requests: screenshots of the editor and Home from this build, on the ci-shots branch (pr-<N>/), so a
      # layout change can be looked at before merging.
      - name: Screenshots (pull requests)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        run: |
          mkdir -p /tmp/site && cp -r build/web "/tmp/site/${{ github.event.repository.name }}"
          (cd /tmp/site && python3 -m http.server 8080 >/dev/null 2>&1 &)
          mkdir -p /tmp/shots-tool && cp tools/ci_screens.mjs /tmp/shots-tool/ && cd /tmp/shots-tool
          npm init -y >/dev/null && npm install --no-audit --no-fund playwright@1.49.1 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          node ci_screens.mjs "http://localhost:8080/${{ github.event.repository.name }}/" "/tmp/shots/pr-${{ github.event.pull_request.number }}"
          cd /tmp/shots && git init -q && git checkout -q -b ci-shots && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "shots ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots
      - name: Save the web build to the web-build branch
        if: github.event_name != 'pull_request'
        run: |
          cd build/web && git init -q && git checkout -q -b web-build && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "web ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-build

  pages:
    name: Publish web app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Deploying fails with "Not Found" until Pages is switched on and set to publish from Actions.
      # That is a one-time repository setting: Settings → Pages → Build and deployment → Source: GitHub Actions.
      - name: Check that GitHub Pages publishes from Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null); then
            echo "Pages build type: $t"
            if [ "$t" = "workflow" ]; then
              echo "on=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=GitHub Pages publishes from a branch::Set Settings → Pages → Source to 'GitHub Actions', then re-run this job."
          else
            echo "::warning title=GitHub Pages is off::Switch it on once: Settings → Pages → Build and deployment → Source: GitHub Actions. Then re-run this job. Meanwhile the web build is on the web-build branch."
          fi
          echo "on=false" >> "$GITHUB_OUTPUT"
      - id: deploy
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write # to publish the GitHub Release on a version tag
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          ./tools/package_windows.ps1 -NoBuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-windows
          path: build/windows/x64/runner/Release/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-windows-installer
          path: build/windows/installer/*.exe
      # Test channel: each pull request's installer as a pre-release ("RoboCore test build – PR #10"), downloadable
      # without signing in, to try on a real board before merging. Pre-releases are never "latest", so the website's
      # download button keeps the real release. release-test-cleanup.yml deletes it when the PR is closed.
      - name: Publish the test build (pull requests)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          tag="test-pr-$PR"
          exe="build/windows/installer/RoboCore-Setup-test-PR$PR.exe"
          cp build/windows/installer/RoboCore-Setup-*.exe "$exe"
          gh release delete "$tag" --cleanup-tag -y >/dev/null 2>&1 || true
          notes="Test build of #$PR ($TITLE), commit ${SHA:0:7}. Not a release: install it to try the change, then merge."
          gh release create "$tag" "$exe" --prerelease --target "$SHA" --title "RoboCore test build – PR #$PR" --notes "$notes"
      - name: Publish the GitHub Release
        if: needs.check.outputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" build/windows/installer/*.exe --clobber
          else
            gh release create "$TAG" build/windows/installer/*.exe --target "$GITHUB_SHA" --title "RoboCore $TAG" --generate-notes
          fi

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux --release
      - run: tar -czf robocore-ide-linux-x64.tar.gz -C build/linux/x64/release bundle
      - run: bash tools/package_rpm.sh build/linux/x64/release/bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-linux
          path: |
            robocore-ide-linux-x64.tar.gz
            robocore-ide-linux-x64.rpm

  macos:
    name: macOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release
      - run: cd build/macos/Build/Products/Release && zip -qry "$GITHUB_WORKSPACE/robocore-ide-macos.zip" *.app
      # The offline bundles (arduino-cli, board tools, libraries) for each kind of Mac: about 2.5 GB to download
      # each, so they are kept between runs until the script (with its versions) or the RoboCore library changes.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: build/offline-*
          key: offline-${{ hashFiles('tools/make_offline_bundle.sh', 'firmware/RoboCore/**') }}
      - run: |
          for arch in arm64 x86_64; do
            [ -f "build/offline-$arch/manifest.json" ] || bash tools/make_offline_bundle.sh "$arch"
          done
      # One DMG for each kind of Mac, each able to compile with no internet.
      - run: bash tools/package_dmg.sh build/macos/Build/Products/Release/RoboCore.app robocore-ide-macos-apple-silicon.dmg build/offline-arm64
      - run: bash tools/package_dmg.sh build/macos/Build/Products/Release/RoboCore.app robocore-ide-macos-intel.dmg build/offline-x86_64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-macos
          path: |
            robocore-ide-macos.zip
            robocore-ide-macos-apple-silicon.dmg
            robocore-ide-macos-intel.dmg

  ios:
    name: iOS (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/robocore-ide-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-ios-unsigned
          path: robocore-ide-ios-unsigned.zip

  # On a version tag: the Android, Linux and macOS apps join the Windows installer on the GitHub Release, so every
  # platform downloads from the release page. Runs after the Windows job, which creates the release if needed. Each
  # app is also attached without its version in the name, for links that always fetch the newest version.
  release-assets:
    name: Attach apps to the release
    if: needs.check.outputs.release_tag != ''
    needs: [check, windows, android, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: apps
          pattern: robocore-ide-{android,linux,macos,windows-installer}
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          tag="${TAG}"
          v="${tag#v}"
          mkdir -p out
          cp apps/robocore-ide-android/app-release.apk "out/RoboCore-$v-android.apk"
          cp apps/robocore-ide-linux/robocore-ide-linux-x64.tar.gz "out/RoboCore-$v-linux-x64.tar.gz"
          cp apps/robocore-ide-linux/robocore-ide-linux-x64.rpm "out/RoboCore-$v-linux-x64.rpm"
          cp apps/robocore-ide-macos/robocore-ide-macos-apple-silicon.dmg "out/RoboCore-$v-mac-apple-silicon.dmg"
          cp apps/robocore-ide-macos/robocore-ide-macos-intel.dmg "out/RoboCore-$v-mac-intel.dmg"
          ls -la out
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "RoboCore $tag" --generate-notes
          fi
          gh release upload "$tag" out/* --clobber
      # RoboCore-mac-intel.dmg, RoboCore-Setup.exe and so on: the website's download buttons link to
      # releases/latest/download/<these names>, so they fetch this version as soon as it is the latest release.
      - name: Attach the apps without the version in their names
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.release_tag }}
        run: |
          cp apps/robocore-ide-windows-installer/*.exe out/
          bash tools/release_latest_names.sh "${TAG}" out
