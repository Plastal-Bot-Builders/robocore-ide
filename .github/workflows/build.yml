name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned so a new Flutter release can't change or break a build by surprise. Update on purpose.
  FLUTTER_VERSION: 3.47.7

jobs:
  check:
    name: Analyze and test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: USB bridge (fake Web Serial and esptool) and editor shortcuts, in Node
        run: node --test test/js/robocore_usb.test.mjs test/js/robocore_editors.test.mjs test/js/robocore_serial_shim.test.mjs
      - name: Analyze
        run: |
          set +e
          dart analyze --format=machine > analyze.txt 2>&1
          # Show errors first, then warnings, as annotations on the run page.
          for lvl in ERROR WARNING; do
            grep "^$lvl|" analyze.txt | awk -F"|" '!seen[$3 FS $8]++' | head -45 | while IFS='|' read -r sev type code file line col len msg; do
              f=${file#$GITHUB_WORKSPACE/}
              echo "::error file=$f,line=$line,col=$col,title=$code::$f:$line:$col $msg"
            done
          done
          cat analyze.txt
          ! grep -q "^ERROR|" analyze.txt
      - name: Test
        run: |
          set +e
          flutter test --reporter expanded > test.txt 2>&1
          code=$?
          cat test.txt
          exit $code
      - name: Save logs to the ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/ci && cp analyze.txt test.txt /tmp/ci/ 2>/dev/null || true
          cd /tmp/ci && git init -q && git checkout -q -b ci-logs && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "logs ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-logs

  web:
    name: Web
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build web --release --no-web-resources-cdn --base-href "/${{ github.event.repository.name }}/"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/web
      - name: Save the web build to the web-build branch
        if: github.event_name != 'pull_request'
        run: |
          cd build/web && git init -q && git checkout -q -b web-build && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "web ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" web-build

  pages:
    name: Publish web app
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: web
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Deploying fails with "Not Found" until Pages is switched on and set to publish from Actions.
      # That is a one-time repository setting: Settings → Pages → Build and deployment → Source: GitHub Actions.
      - name: Check that GitHub Pages publishes from Actions
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if t=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null); then
            echo "Pages build type: $t"
            if [ "$t" = "workflow" ]; then
              echo "on=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "::warning title=GitHub Pages publishes from a branch::Set Settings → Pages → Source to 'GitHub Actions', then re-run this job."
          else
            echo "::warning title=GitHub Pages is off::Switch it on once: Settings → Pages → Build and deployment → Source: GitHub Actions. Then re-run this job. Meanwhile the web build is on the web-build branch."
          fi
          echo "on=false" >> "$GITHUB_OUTPUT"
      - id: deploy
        if: steps.pages.outputs.on == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  android:
    name: Android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build apk --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-android
          path: build/app/outputs/flutter-apk/app-release.apk

  windows:
    name: Windows
    needs: check
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build windows --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-windows
          path: build/windows/x64/runner/Release/

  linux:
    name: Linux
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Linux desktop build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev rpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build linux --release
      - run: tar -czf robocore-ide-linux-x64.tar.gz -C build/linux/x64/release bundle
      - run: bash tools/package_rpm.sh build/linux/x64/release/bundle
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-linux
          path: |
            robocore-ide-linux-x64.tar.gz
            robocore-ide-linux-x64.rpm

  macos:
    name: macOS
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build macos --release
      - run: cd build/macos/Build/Products/Release && zip -qry "$GITHUB_WORKSPACE/robocore-ide-macos.zip" *.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-macos
          path: robocore-ide-macos.zip

  ios:
    name: iOS (unsigned)
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter build ios --release --no-codesign
      - run: cd build/ios/iphoneos && zip -qry "$GITHUB_WORKSPACE/robocore-ide-ios-unsigned.zip" Runner.app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: robocore-ide-ios-unsigned
          path: robocore-ide-ios-unsigned.zip
