name: Remove a test build

# A pull request's test build (build.yml's "Publish the test build") is deleted when the PR is merged or closed.
# Each push to main also sweeps up test builds of PRs that are already closed (one whose cleanup didn't run).
on:
  pull_request:
    types: [closed]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the test builds of closed pull requests
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("test-pr-"))'); do
            pr="${tag#test-pr-}"
            state=$(gh pr view "$pr" --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$state" = "MERGED" ] || [ "$state" = "CLOSED" ]; then
              echo "Deleting $tag (PR $pr is $state)"
              gh release delete "$tag" --cleanup-tag -y || echo "Already gone (another cleanup run took it)."
            else
              echo "Keeping $tag (PR $pr is $state)"
            fi
          done
