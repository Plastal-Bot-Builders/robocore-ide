name: Remove a test build

# A pull request's test build (build.yml's "Publish the test build") is deleted when the PR is merged or closed.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the test-pr pre-release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: gh release delete "test-pr-$PR" --cleanup-tag -y || echo "No test build for #$PR."
