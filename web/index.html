<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href` (for GitHub Pages: /robocore-ide/). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="RoboCore IDE: build, code and upload sketches to the RoboCore robot, with blocks or C++.">
  <meta name="theme-color" content="#1B2A41">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="RoboCore">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <!-- Favicon: the Geared Ring app icon. The SVG follows the browser's light/dark theme;
       browsers without SVG favicons use the 32 px PNG. Made by tools/gen_app_icons.py. -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png"/>
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <title>RoboCore</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="background:#F2B01E">
  <!-- While the app downloads: the Geared Ring mark where the launch animation (lib/ui/splash.dart) draws it,
       the same width (kSplashMarkWidth), gently breathing. The app takes over on its first frame. -->
  <style>
    #rc-launch { position: fixed; left: 50%; top: 50%; width: 200px; transform: translate(-50%, -50%);
      opacity: 0; animation: rc-in .4s ease-out .25s forwards, rc-breathe 1.6s ease-in-out .65s infinite; }
    @keyframes rc-in { from { opacity: 0; transform: translate(-50%, -50%) scale(.9); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
    @keyframes rc-breathe { 0%, 100% { opacity: 1; } 50% { opacity: .72; } }
    @media (prefers-reduced-motion: reduce) { #rc-launch { animation: none; opacity: 1; } }
  </style>
  <img id="rc-launch" src="assets/assets/images/app_mark.svg" alt="">
  <script>
    window.addEventListener('flutter-first-frame', () => document.getElementById('rc-launch')?.remove());
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
