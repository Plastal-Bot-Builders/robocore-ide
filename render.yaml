# Render blueprint for the RoboCore compile server.
# In Render: New > Blueprint > pick this repo. It builds server/Dockerfile from the repo root.
services:
  - type: web
    name: robocore-compile
    runtime: docker
    plan: free
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://plastal-bot-builders.github.io,http://localhost:*,http://127.0.0.1:*
      - key: MAX_RUNNING
        value: "1"
      - key: COMPILE_JOBS
        value: "1"
      # Cog: paste the Anthropic API key in Render's dashboard when it asks (it is never stored in this repo).
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: COG_MODEL
        value: claude-opus-5-5
